[package]
name = "surveillance"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "surveillance"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "signal", "fs"] }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
